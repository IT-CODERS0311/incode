<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incode | Where Code Meets Creativity</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #fff8e7; /* Cream background */
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: fadeIn 1.5s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

header {
  text-align: center;
  margin-bottom: 60px;
  position: relative;
}

.logo {
  width: 250px;
  height: 150px;
  background-image: url('https://i.ibb.co/YZ9k9F6/laptop-bulb.png'); /* laptop + bulb image */
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  margin: auto;
}

header h1 {
  font-size: 3rem;
  color: #6a0dad; /* Purple-beige tone */
  font-weight: 800;
  margin-top: 10px;
  letter-spacing: 1px;
}

header p {
  font-size: 1.2rem;
  color: #8b6d5c; /* Beige text tone */
  letter-spacing: 1px;
  margin-top: 8px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 25px;
  margin-top: 40px;
}

a {
  text-decoration: none;
  background: rgba(255, 255, 255, 0.85);
  color: #6a0dad; /* Purple-beige buttons */
  padding: 15px 35px;
  border-radius: 15px;
  font-weight: 600;
  font-size: 1.1rem;
  backdrop-filter: blur(5px);
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
}

a:hover {
  background: linear-gradient(135deg, #9d50bb, #6e48aa); /* Purple hover gradient */
  color: white;
  transform: translateY(-4px);
  box-shadow: 0 6px 20px rgba(106,13,173,0.4);
}

footer {
  margin-top: 60px;
  text-align: center;
  color: #8b6d5c; /* Beige footer text */
  font-size: 0.9rem;
  font-weight: 500;
}

@media (max-width: 600px) {
  header h1 {
    font-size: 2.2rem;
  }

  nav a {
    padding: 12px 25px;
    font-size: 1rem;
  }

  .logo {
    width: 200px;
    height: 120px;
  }
}
</style>
</head>
<body>

<header>
  <div class="logo"></div>
  <h1>Incode</h1>
  <p>Where Code Meets Creativity ✨</p>
</header>

<nav>
  <a href="Abt.html"><b><u>About Me</u></b></a>
  <a href="portfolio.html"><b><u>Portfolio</u></b></a>
  <a href="Blog.html"><b><u>Blog</u></b></a>
  <a href="Contact.html"><b><u>Contact</u></b></a>
  <a href="courses.html"><b><u>Online Courses</u></b></a>
</nav>

<footer>
  <p>© 2025 Incode by Ishita — Build · Code · Inspire 💻</p>
</footer>

</body>
</html>
