<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incode | Contact</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #f9f7f5 0%, #f3e8ff 100%);
      color: #2c2c2c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .contact-container {
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.15);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      max-width: 600px;
      width: 90%;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 32px;
      margin: 0 auto 15px;
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
    }

    h1 {
      font-size: 1.8rem;
      color: #8b5cf6;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 30px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input, textarea {
      padding: 12px 15px;
      border: none;
      border-radius: 10px;
      background: #f3e8ff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus {
      background: #ede2ff;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.3);
    }

    textarea {
      resize: none;
      height: 120px;
    }

    button {
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .social-links {
      margin-top: 30px;
    }

    .social-links a {
      color: #8b5cf6;
      margin: 0 12px;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.3s;
    }

    .social-links a:hover {
      color: #ec4899;
    }

    footer {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #777;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      .contact-container { padding: 30px 20px; }
    }
  </style>
</head>
<body>
  <div class="contact-container">
    <div class="logo">I</div>
    <h1>Contact Incode</h1>
    <p>Let’s build something creative together 💡<br>Get in touch for collaborations, website ideas, or queries.</p>

    <div class="social-links">
      <a href="https://instagram.com/Incode2025" target="_blank">Instagram</a> |
      <a href="tel:+8979653786">Call Us Now</a> |
      <a href="mailto:ishishitasaxena@gmail.com">Mail</a>
    </div>

    <footer>© 2025 Incode — Where Code Meets Creativity</footer>
  </div>
</body>
</html>
